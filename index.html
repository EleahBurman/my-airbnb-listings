<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AirBNB Listings</title>

    <!-- Bootstrap CSS from a CDN — gives us card/grid styling for free -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN"
      crossorigin="anonymous"
    />

    <link rel="icon" type="image/x-icon" href="https://www.airbnb.com/favicon.ico" />
    <!-- our own custom styles, layered on top of Bootstrap -->
    <link rel="stylesheet" href="css/main.css" />
  </head>
  <body>
    <div class="container">
      <h1>AirBNB Listings Reloaded!</h1>

      <hr />

      <section>
        <h2>Listings</h2>
        <!-- Sort dropdown-->
         <div class="mb-3">
            <label for="sortSelect" class="form-label">Sort by:</label>
            <select id="sortSelect" class="form-select w-auto d-inline-block">
                <option value="default">Default order</option>
                <option value="priceAsc">Price: Low to High</option>
                <option value="priceDesc">Price: High to Low</option>
                <option value="rating">Highest Rated</option>
            </select>
        </div>
        <!--
          This div starts EMPTY on purpose.
          main.js will fetch the JSON data and inject one
          "card" element per listing into here at runtime.
        -->
        <div id="listings" class="row"></div>
      </section>

      <!-- 
        One shared modal for ALL listings. We don't create a separate modal
        per listing — instead, JS will fill in these elements with whichever
        listing was clicked, right before showing it.
      -->
        <div class="modal fade" id="listingModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-scrollable">
            <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="modalListingName"></h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <img id="modalListingImage" class="img-fluid mb-3" alt="" />
                <p id="modalListingPrice" class="fw-bold"></p>
                <p id="modalListingDescription"></p>
                <p id="modalListingAmenities"></p>
                <div class="d-flex align-items-center gap-2">
                <img id="modalHostImage" width="48" height="48" style="border-radius: 50%; object-fit: cover;" alt="" />
                <span id="modalHostName"></span>
                </div>
            </div>
            </div>
        </div>
        </div>
    </div>

    <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL"
    crossorigin="anonymous"
    ></script>
    <!-- our JS runs after the DOM above exists, so #listings is ready to be filled in -->
    <script src="js/main.js"></script> 
  </body>
</html>
